<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrchLab Workshop — Environment OK</title>
<style>
  :root {
    --bg: #2E3B28;
    --card: #3A4534;
    --accent: #8CC26C;
    --white: #FFFFFF;
    --muted: #A8B8A0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 48px 64px;
    text-align: center;
    max-width: 680px;
  }
  .tick {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 44px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .sub {
    margin: 0 0 32px;
    font-size: 17px;
    color: var(--muted);
  }
  dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto auto;
    gap: 8px 24px;
    justify-content: center;
    font-size: 14px;
  }
  dt { color: var(--muted); text-align: right; }
  dd { margin: 0; text-align: left; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">&#9989;</div>
    <h1>ENVIRONMENT OK</h1>
    <p class="sub">This page was rendered and screenshotted by Playwright,<br>driven from inside your workshop container.</p>
    <dl>
      <dt>Container</dt><dd id="host">&mdash;</dd>
      <dt>Captured</dt><dd id="stamp">&mdash;</dd>
      <dt>Checkpoint</dt><dd id="checkpoint">&mdash;</dd>
    </dl>
  </div>
</body>
</html>
