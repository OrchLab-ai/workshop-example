# The workshop stack. One group, started once, used all day.
#
#   docker compose -f docker-compose.workshop.yml up -d
#
# Everything an attendee needs is in here, which is the point: the only things
# required on the host are Docker, Claude Code (for `claude setup-token`), and git.
#
# Two services run all day, and a third is started only for the Part 3 autonomy
# activity — see the `l4` profile at the bottom.
name: orchlab-workshop

services:
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmf
      POSTGRES_PASSWORD: mmf
      POSTGRES_DB: mmf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mmf']
      interval: 2s
      timeout: 5s
      retries: 15
    # No published port, deliberately. Nothing on the host needs to reach Postgres
    # directly, and publishing 5432 collides with any database an attendee already
    # runs — which turns a working setup into a failed one for no gain.

  # ---------------------------------------------------------------------------
  # Where attendees work for the whole day. Claude Code runs IN HERE, not on the
  # host: that is the isolation layer the deck argues for on slide 39, and it is
  # what makes skipping permission prompts defensible later on.
  #
  # The image is the app's own agent image, not a new one. It already carries
  # Claude Code, the Playwright MCP server, Chromium, dbmate, git and the GitHub
  # CLI, and it already solves two problems that are painful to rediscover: it
  # runs as a non-root `agent` user, because Claude Code refuses to skip
  # permissions as root, and it pre-creates ~/.claude so a volume mount cannot
  # leave that directory owned by root and break Claude's Bash tool.
  claude-container:
    build:
      context: ./app/autonomous
      dockerfile: Dockerfile
    # The image's own entrypoint runs an autonomous loop, which is not what this
    # container is for. It runs the workshop app instead: dependencies, migrations,
    # the API and the site, and then it holds itself open so attendees can exec in.
    # start-app.sh comes from THIS repo rather than from app/, because ./checkpoint.sh
    # rewinds app/ and the thing that boots the container must not move with it.
    entrypoint: ['/usr/local/bin/start-app.sh']
    # GIVE localhost AN IPv4 ADDRESS.
    #
    # The base image ships an /etc/hosts with `::1 localhost` and NO IPv4 entry, so
    # everything inside the container resolving `localhost` gets IPv6 only. Vite is
    # bound with --host 0.0.0.0 — the IPv4 wildcard, exclusively — so the site is
    # unreachable at `localhost` from inside, while being perfectly reachable from
    # the host through the published port.
    #
    # curl hides this by falling back to IPv4, which is why every probe and every
    # health check passed. Headless Chromium has no IPv4 address to fall back to and
    # simply fails, so the ONE thing that broke was the agent's own view of the app.
    #
    # This adds the missing 127.0.0.1 entry, which gives IPv4 something to resolve to
    # everywhere — including in whatever tool an attendee's agent decides to reach for.
    extra_hosts:
      - 'localhost:127.0.0.1'
    working_dir: /workspace/repo
    # CREDENTIALS COME FROM .env DIRECTLY, not from an `environment:` mapping.
    #
    # `ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"` does NOT omit the variable when it
    # is unset - it sets it to the EMPTY STRING, so the container ends up carrying
    # ANTHROPIC_API_KEY present and blank. Interactive Claude Code then sees an API key
    # configured, tries to use it, and drops the attendee at a login prompt - while
    # `claude -p` authenticates fine on the OAuth token. Every check passes and the only
    # thing that fails is the thing they actually do.
    #
    # env_file has the semantics this needs: a line absent or commented out in .env is
    # simply not set in the container. `required: false` so a missing .env stays the
    # environment check's problem to report rather than a raw compose error.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mmf:mmf@db:5432/mmf?sslmode=disable
      JWT_SECRET: workshop-jwt-secret
      # The one port anybody has to care about, and the SAME variable the
      # environment check proves is free - see docker-compose.verify.yml. Set it once
      # in .env and the check, the stack and every URL in the guide follow it.
      WORKSHOP_PORT: "${WORKSHOP_PORT:-5173}"
      # Internal only. The browser never talks to this: the client fetches relative
      # /v1 paths and Vite proxies them to localhost:3001 INSIDE the container.
      PORT_API: '3001'
    volumes:
      # The real repo, so edits show up live in the attendee's editor.
      - ./app:/workspace/repo
      # Shadow every node_modules with a container-only volume. This is not an
      # optimisation: the host is usually Windows, so host node_modules holds
      # win32 binaries (esbuild, lightningcss) that a Linux container cannot run.
      # Source is shared with the host; dependencies are not.
      - workshop_node_modules:/workspace/repo/node_modules
      - workshop_client_node_modules:/workspace/repo/packages/client/node_modules
      - workshop_server_node_modules:/workspace/repo/packages/server/node_modules
      - workshop_shared_node_modules:/workspace/repo/packages/shared/node_modules
      # Screenshots the agent takes land on the host, where they can be looked at.
      - ./screenshots:/screenshots
      # How the app is started. Read-only: it is infrastructure, not an exercise.
      - ./workshop/start-app.sh:/usr/local/bin/start-app.sh:ro
      # The two-vantage browser check. See workshop/verify-views.sh.
      - ./verify/app-views.mjs:/usr/local/bin/app-views.mjs:ro
    ports:
      # The app, served from inside the container so it can be viewed in a normal
      # browser on the host. Host and container port are deliberately the SAME value:
      # Vite's HMR websocket infers its port from the page URL, so mapping 5174->5173
      # would serve a page whose live-reload silently never connects.
      #
      # The API is deliberately NOT published. Nothing on the host needs it - the
      # browser only ever talks to the port below - and every published port is
      # another collision with something the attendee already runs.
      - "${WORKSHOP_PORT:-5173}:${WORKSHOP_PORT:-5173}"
    mem_limit: 4g
    cpus: 2
    # Healthy means THE APP ANSWERS, not that the container is running. Without this
    # `docker compose ps` reports "Up" seconds after start, while the app inside is
    # still minutes from serving - which is the same lie `up -d` tells. It also makes
    # plain `docker compose up -d --wait` behave, for anyone not using workshop/up.sh.
    #
    # start_period is long because the first run installs a monorepo's dependencies
    # inside the container; failures during that window do not count against retries.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://localhost:${WORKSHOP_PORT:-5173}/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 600s
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Part 3 only. Started on demand, never as part of the day's background stack:
  #
  #   docker compose -f docker-compose.workshop.yml --profile l4 up autonomous-agent
  #
  # This is the headless one. No interactive session, no TTY — it runs
  # `claude --dangerously-skip-permissions --print` in a loop against a prompt,
  # bounded by an iteration cap, a cooldown and a timeout. Attendees watch the log
  # rather than drive it, which is the entire lesson of the activity.
  autonomous-agent:
    profiles: ['l4']
    extra_hosts:
      - 'localhost:127.0.0.1'
    build:
      context: ./app/autonomous-demo
      dockerfile: Dockerfile
    # CREDENTIALS COME FROM .env DIRECTLY, not from an `environment:` mapping.
    #
    # `ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"` does NOT omit the variable when it
    # is unset - it sets it to the EMPTY STRING, so the container ends up carrying
    # ANTHROPIC_API_KEY present and blank. Interactive Claude Code then sees an API key
    # configured, tries to use it, and drops the attendee at a login prompt - while
    # `claude -p` authenticates fine on the OAuth token. Every check passes and the only
    # thing that fails is the thing they actually do.
    #
    # env_file has the semantics this needs: a line absent or commented out in .env is
    # simply not set in the container. `required: false` so a missing .env stays the
    # environment check's problem to report rather than a raw compose error.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://mmf:mmf@db:5432/mmf?sslmode=disable
      JWT_SECRET: workshop-jwt-secret
      # The guardrails are the point of the exercise, so they are visible here
      # rather than buried in the image.
      MAX_ITERATIONS: "${MAX_ITERATIONS:-30}"
      COOLDOWN_SECONDS: "${COOLDOWN_SECONDS:-3}"
      TIMEOUT_SECONDS: "${TIMEOUT_SECONDS:-1800}"
    volumes:
      - ./app:/workspace/repo
      - agent_node_modules:/workspace/repo/node_modules
      - agent_client_node_modules:/workspace/repo/packages/client/node_modules
      - agent_server_node_modules:/workspace/repo/packages/server/node_modules
      - agent_shared_node_modules:/workspace/repo/packages/shared/node_modules
      - ./app/autonomous-demo/PROMPT.md:/workspace/PROMPT.md:ro
      - ./screenshots:/screenshots
    mem_limit: 4g
    cpus: 2
    depends_on:
      db:
        condition: service_healthy

  # The host-side half of the two-vantage check. It reaches the app over the compose
  # network rather than through localhost, which is the vantage an attendee's browser
  # has. Compared against the in-container view by workshop/verify-views.sh; the two
  # disagreeing is the signal, and is exactly what the IPv6 localhost bug looked like.
  verify-views:
    profiles: ['check']
    build:
      context: .
      dockerfile: verify/Dockerfile
    environment:
      VERIFY_URL: 'http://claude-container:${WORKSHOP_PORT:-5173}/'
      VERIFY_OUT: '/screenshots/verify-outside.png'
      VERIFY_LABEL: 'outside'
    volumes:
      - ./verify/app-views.mjs:/work/app-views.mjs:ro
      - ./screenshots:/screenshots
    command: ['node', '/work/app-views.mjs']

volumes:
  workshop_node_modules:
  workshop_client_node_modules:
  workshop_server_node_modules:
  workshop_shared_node_modules:
  agent_node_modules:
  agent_client_node_modules:
  agent_server_node_modules:
  agent_shared_node_modules:
